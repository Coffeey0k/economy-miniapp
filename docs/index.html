<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .balance {
    font-size: 32px;
    font-weight: 700;
    color: var(--link);
  }
  .label {
    color: var(--hint);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .stat-row, .item-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(128,128,128,0.15);
  }
  .stat-row:last-child, .item-row:last-child { border-bottom: none; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  #status { color: var(--hint); text-align: center; padding: 40px 0; }
  .top-row { display: flex; gap: 10px; margin-top: 8px; }
  .pill {
    background: rgba(128,128,128,0.15);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .used { color: var(--hint); text-decoration: line-through; }
  .active-tag {
    font-size: 11px;
    background: var(--link);
    color: #fff;
    border-radius: 6px;
    padding: 2px 6px;
    margin-left: 6px;
  }
</style>
</head>
<body>

<div id="status">Загрузка профиля…</div>
<div id="content" style="display:none;">

  <div class="card">
    <div class="label" id="username">Профиль</div>
    <div class="balance" id="balance">0</div>
    <div class="top-row">
      <div class="pill">🏆 Топ #<span id="rank">-</span></div>
      <div class="pill">⚠️ Варны: <span id="warns">0</span></div>
    </div>
  </div>

  <div class="card" id="profession-card" style="display:none;">
    <h2>Профессия</h2>
    <div id="profession"></div>
  </div>

  <div class="card">
    <h2>Статистика игр</h2>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h2>Питомцы</h2>
    <div id="pets"></div>
  </div>

  <div class="card">
    <h2>Купленные услуги</h2>
    <div id="purchases"></div>
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // ЗАМЕНИ на адрес своего задеплоенного backend
  const API_URL = "https://web-appflood.onrender.com/";

  async function loadProfile() {
    try {
      const initData = tg.initData;
      const res = await fetch(`${API_URL}?initData=${encodeURIComponent(initData)}`);
      if (!res.ok) throw new Error("Ошибка загрузки: " + res.status);
      const data = await res.json();
      renderProfile(data);
    } catch (err) {
      document.getElementById("status").textContent =
        "Не удалось загрузить профиль. " + err.message;
    }
  }

  function renderProfile(data) {
    document.getElementById("username").textContent =
      (data.username ? "@" + data.username : "ID " + data.user_id);
    document.getElementById("balance").textContent = data.balance + " 🪙";
    document.getElementById("rank").textContent = data.rank;
    document.getElementById("warns").textContent = data.warns;

    // Профессия
    if (data.profession) {
      document.getElementById("profession-card").style.display = "block";
      document.getElementById("profession").innerHTML = `
        <div class="stat-row">
          <span>${data.profession.name}</span>
          <span>Уровень ${data.profession.level}</span>
        </div>`;
    }

    // Статистика
    const statsEl = document.getElementById("stats");
    statsEl.innerHTML = Object.entries(data.stats).map(([k, v]) => `
      <div class="stat-row"><span>${k}</span><span>${v}</span></div>
    `).join("");

    // Питомцы
    const petsEl = document.getElementById("pets");
    petsEl.innerHTML = data.pets.length
      ? data.pets.map(p => `
          <div class="item-row">
            <span>${p.name} (${p.rarity})${p.is_active ? '<span class="active-tag">активен</span>' : ''}</span>
            <span>+${p.income}/4ч</span>
          </div>
        `).join("")
      : `<div class="label">Питомцев пока нет</div>`;

    // Покупки
    const purchasesEl = document.getElementById("purchases");
    purchasesEl.innerHTML = data.purchases.length
      ? data.purchases.map(p => `
          <div class="item-row">
            <span class="${p.is_used ? 'used' : ''}">${p.name}</span>
            <span>${p.is_used ? 'использовано' : 'активно'}</span>
          </div>
        `).join("")
      : `<div class="label">Покупок пока нет</div>`;

    document.getElementById("status").style.display = "none";
    document.getElementById("content").style.display = "block";
  }

  loadProfile();
</script>

</body>
</html>
