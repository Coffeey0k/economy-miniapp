name: Python syntax check

on:
  pull_request:
  push:
    branches:
      - main
      - "perf/**"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile backend Python files
        run: python -m compileall -q backend
