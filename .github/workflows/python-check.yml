name: Python syntax check

on:
  push:
    branches: [main, audit-fixes]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend Python files
        run: python -m compileall -q backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline Mini App JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          Path("/tmp/miniapp-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/miniapp-inline.js

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lavender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lavender_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PATH: postgresql://postgres:postgres@localhost:5432/lavender_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lavender_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: pip install psycopg2-binary
      - name: Smoke-test database migrations and new systems
        run: python backend/tests/lavender_smoke.py
